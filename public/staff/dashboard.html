<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusFix — Staff</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/staff/dashboard.html">
        <div class="brand-mark">CF</div>
        CampusFix <small>&nbsp;STAFF DESK</small>
      </a>
      <div class="topbar-right">
        <span class="role-pill" id="userName"></span>
        <button class="btn secondary small" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="panel-title" style="margin-top:20px;">My assigned complaints</div>
    <div id="list">Loading…</div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // First line of defense: make sure only staff members can access this page. If not, they get booted to login.
    const user = guard('staff');
    // Personalize the topbar with the staff member's name.
    document.getElementById('userName').textContent = user.name;

    // Fetches all the complaints currently assigned to this staff member and renders them.
    async function load() {
      const list = document.getElementById('list');
      try {
        const { complaints } = await api('/staff/complaints');
        if (complaints.length === 0) {
          list.innerHTML = `<div class="card empty">Nothing assigned to you right now.</div>`;
          return;
        }
        list.innerHTML = complaints.map(renderTicket).join('');
        wireActions();
      } catch (err) {
        list.innerHTML = `<div class="error-msg" style="display:block;">${err.message}</div>`;
      }
    }

    // Takes a raw complaint object and turns it into a neat, blueprint-style ticket card.
    function renderTicket(c) {
      const statusClass = c.status.replace(' ', '-');
      return `
        <div class="ticket priority-${c.priority}">
          <div class="ticket-top">
            <div>
              <div class="ticket-id">${fmtTicketId(c.id)} · ${c.category} · from ${escapeHtml(c.student_name)}</div>
              <div class="ticket-title">${escapeHtml(c.title)}</div>
            </div>
            <div class="stamp ${statusClass}">${c.status}</div>
          </div>
          <div class="ticket-desc">${escapeHtml(c.description)}</div>
          <div class="ticket-meta">
            <span>📍 ${escapeHtml(c.location)}</span>
            <span class="tag ${c.priority}">${c.priority}</span>
            <span>${fmtDate(c.created_at)}</span>
          </div>
          ${c.image_path ? `<img class="ticket-image" src="${c.image_path}" alt="Complaint photo" />` : ''}

          ${c.status !== 'Resolved' ? `
            <div class="row" style="margin-top:14px; align-items:flex-end;">
              <div>
                <label>Update status</label>
                <select class="status-select" data-id="${c.id}">
                  <option ${c.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                  <option ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                </select>
              </div>
              <div style="flex:2;">
                <label>Resolution note (fill in, then click Resolve)</label>
                <input type="text" class="resolve-note" data-id="${c.id}" placeholder="What was done to fix it?" />
              </div>
              <div>
                <button class="btn accent resolve-btn" data-id="${c.id}">Mark Resolved</button>
              </div>
            </div>
          ` : `
            <div style="margin-top:10px; font-size:12.5px; color:var(--success);"><strong>Resolved:</strong> ${escapeHtml(c.resolution_note || '')}</div>
          `}
        </div>
      `;
    }

    // Hooks up the status dropdowns and "Mark Resolved" buttons on the newly rendered tickets so they actually update the backend.
    function wireActions() {
      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          try {
            await api(`/staff/complaints/${sel.dataset.id}/status`, { method: 'PATCH', body: { status: sel.value } });
            load();
          } catch (err) { alert(err.message); }
        });
      });
      document.querySelectorAll('.resolve-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const note = document.querySelector(`.resolve-note[data-id="${id}"]`).value.trim();
          if (!note) { alert('Please add a resolution note first.'); return; }
          try {
            await api(`/staff/complaints/${id}/resolve`, { method: 'PATCH', body: { resolution_note: note } });
            load();
          } catch (err) { alert(err.message); }
        });
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    load();
  </script>
</body>
</html>
