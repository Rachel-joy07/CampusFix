Description: 
This HTML file provides the form interface for students to submit new campus complaints.
It includes fields for the issue title, category, description, location, and optional image attachments.
The form is designed to capture all necessary details to help staff efficiently resolve the reported problems.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusFix — Submit Complaint</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/student/dashboard.html">
        <div class="brand-mark">CF</div>
        CampusFix <small>&nbsp;STUDENT DESK</small>
      </a>
      <div class="topbar-right">
        <span class="role-pill" id="userName"></span>
        <button class="btn secondary small" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <a href="/student/dashboard.html">My Complaints</a>
      <a href="/student/submit.html" class="active">Submit Complaint</a>
      <a href="/student/notifications.html">Notifications</a>
    </div>

    <div class="card" style="max-width:560px;">
      <div class="panel-title">New complaint</div>
      <div id="msg" class="error-msg"></div>

      <form id="form">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Broken chair in Library" />

        <label for="description">Description</label>
        <textarea id="description" required placeholder="Describe the issue in detail…"></textarea>

        <div class="row">
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Electrical">Electrical</option>
              <option value="Plumbing">Plumbing</option>
              <option value="Furniture">Furniture</option>
              <option value="Networking/WiFi">Networking / WiFi</option>
              <option value="Cleaning">Cleaning</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <label for="location">Location</label>
        <input type="text" id="location" required placeholder="e.g. Hostel Block C, Room 12" />

        <label for="image">Photo (optional)</label>
        <input type="file" id="image" accept="image/png, image/jpeg, image/webp" />

        <button type="submit" class="btn full" style="margin-top:22px;">Submit complaint</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = guard('student');
    document.getElementById('userName').textContent = user.name;

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMsg(msg, '');
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const fd = new FormData();
      fd.append('title', document.getElementById('title').value.trim());
      fd.append('description', document.getElementById('description').value.trim());
      fd.append('category', document.getElementById('category').value);
      fd.append('priority', document.getElementById('priority').value);
      fd.append('location', document.getElementById('location').value.trim());
      const imageFile = document.getElementById('image').files[0];
      if (imageFile) fd.append('image', imageFile);

      try {
        await api('/student/complaints', { method: 'POST', body: fd, isForm: true });
        window.location.href = '/student/dashboard.html';
      } catch (err) {
        showMsg(msg, err.message);
        btn.disabled = false;
        btn.textContent = 'Submit complaint';
      }
    });
  </script>
</body>
</html>
