Description: 
This is the main entry point HTML file and serves as the login page for the application.
It provides the authentication form for all user types (students, staff, and admins) to access the system.
If a user is already authenticated, the page automatically redirects them to their respective dashboard.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFix — Log in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">CF</div>
        <h1 style="font-size:20px;">CampusFix</h1>
      </div>
      <div class="auth-sub">Campus complaint desk — log a fix, track a fix.</div>

      <div id="msg" class="error-msg"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@campusfix.edu" />

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />

        <button type="submit" class="btn full" style="margin-top:20px;">Log in</button>
      </form>

      <div class="auth-switch">
        New student? <a href="/register.html">Create an account</a>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    //Check right when the page loads: if you're already logged in, there's no need to see this page. We'll bounce you straight to your dashboard.
    (function () {
      const user = getUser();
      if (user && getToken()) window.location.href = `/${user.role}/dashboard.html`;
    })();

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    // When you click 'Log in'. We stop the page from refreshing, grab the credentials, and ask the backend if they're valid.
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMsg(msg, '');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { token, user } = await api('/auth/login', { method: 'POST', body: { email, password } });
        setSession(token, user);
        window.location.href = `/${user.role}/dashboard.html`;
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>

</html>
