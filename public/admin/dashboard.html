<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusFix — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/admin/dashboard.html">
        <div class="brand-mark">CF</div>
        CampusFix <small>&nbsp;ADMIN DESK</small>
      </a>
      <div class="topbar-right">
        <span class="role-pill" id="userName"></span>
        <button class="btn secondary small" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="stats" class="stats-grid"></div>

    <div class="panel-title">All complaints</div>
    <div class="filters">
      <select id="fStatus">
        <option value="">All statuses</option>
        <option>Pending</option>
        <option>Assigned</option>
        <option>In Progress</option>
        <option>Resolved</option>
      </select>
      <select id="fPriority">
        <option value="">All priorities</option>
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
      <select id="fCategory">
        <option value="">All categories</option>
        <option>Electrical</option>
        <option>Plumbing</option>
        <option>Furniture</option>
        <option>Networking/WiFi</option>
        <option>Cleaning</option>
        <option>Other</option>
      </select>
    </div>

    <div id="list">Loading…</div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = guard('admin');
    document.getElementById('userName').textContent = user.name;

    let staffList = [];

    async function loadStats() {
      const { total, byStatus, byPriority, avgRating } = await api('/admin/stats');
      const resolved = (byStatus.find(s => s.status === 'Resolved') || {}).n || 0;
      const high = (byPriority.find(p => p.priority === 'High') || {}).n || 0;
      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total complaints</div></div>
        <div class="stat-card"><div class="stat-num">${resolved}</div><div class="stat-label">Resolved</div></div>
        <div class="stat-card"><div class="stat-num">${high}</div><div class="stat-label">High priority</div></div>
        <div class="stat-card"><div class="stat-num">${avgRating || '—'}</div><div class="stat-label">Avg. rating</div></div>
      `;
    }

    async function loadStaff() {
      const { staff } = await api('/admin/staff');
      staffList = staff;
    }

    async function loadList() {
      const list = document.getElementById('list');
      const params = new URLSearchParams();
      const status = document.getElementById('fStatus').value;
      const priority = document.getElementById('fPriority').value;
      const category = document.getElementById('fCategory').value;
      if (status) params.set('status', status);
      if (priority) params.set('priority', priority);
      if (category) params.set('category', category);

      try {
        const { complaints } = await api(`/admin/complaints?${params.toString()}`);
        if (complaints.length === 0) {
          list.innerHTML = `<div class="card empty">No complaints match these filters.</div>`;
          return;
        }
        list.innerHTML = complaints.map(renderTicket).join('');
        wireActions();
      } catch (err) {
        list.innerHTML = `<div class="error-msg" style="display:block;">${err.message}</div>`;
      }
    }

    function renderTicket(c) {
      const statusClass = c.status.replace(' ', '-');
      const staffOptions = staffList.map(s =>
        `<option value="${s.id}" ${c.assigned_to === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`
      ).join('');

      return `
        <div class="ticket priority-${c.priority}">
          <div class="ticket-top">
            <div>
              <div class="ticket-id">${fmtTicketId(c.id)} · ${c.category} · filed by ${escapeHtml(c.student_name)}</div>
              <div class="ticket-title">${escapeHtml(c.title)}</div>
            </div>
            <div class="stamp ${statusClass}">${c.status}</div>
          </div>
          <div class="ticket-desc">${escapeHtml(c.description)}</div>
          <div class="ticket-meta">
            <span>📍 ${escapeHtml(c.location)}</span>
            <span>${fmtDate(c.created_at)}</span>
          </div>
          ${c.image_path ? `<img class="ticket-image" src="${c.image_path}" alt="Complaint photo" />` : ''}

          <div class="row" style="margin-top:14px;">
            <div>
              <label>Assign to staff</label>
              <select class="assign-select" data-id="${c.id}">
                <option value="">— Unassigned —</option>
                ${staffOptions}
              </select>
            </div>
            <div>
              <label>Priority</label>
              <div style="margin-top: 8px;"><span class="stamp">${c.priority}</span></div>
            </div>
          </div>
          ${c.resolution_note ? `<div style="margin-top:10px; font-size:12.5px; color:var(--success);"><strong>Resolved:</strong> ${escapeHtml(c.resolution_note)}</div>` : ''}
        </div>
      `;
    }

    function wireActions() {
      document.querySelectorAll('.assign-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const staff_id = sel.value ? Number(sel.value) : null;
          try {
            await api(`/admin/complaints/${id}/assign`, { method: 'PATCH', body: { staff_id } });
            loadList();
            loadStats();
          } catch (err) { alert(err.message); }
        });
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    ['fStatus', 'fPriority', 'fCategory'].forEach(id =>
      document.getElementById(id).addEventListener('change', loadList)
    );

    (async () => {
      await loadStaff();
      await loadStats();
      await loadList();
    })();
  </script>
</body>
</html>
